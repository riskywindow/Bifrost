# Local development-only LMCache configuration for fake/demo BIFROST objects.
#
# WARNING: allow_pickle_fallback is unsafe for untrusted payloads. Use this file
# only for local fake MemoryObj tests and never for production LMCache traffic.
#
# LMCache plugin configuration keys have changed across releases. Verify this
# shape against the LMCache version installed in your environment.

remote_storage_plugins:
  - bifrost

remote_url: plugin://bifrost

extra_config:
  remote_storage_plugin.bifrost.module_path: lmcache_bifrost.adapter
  remote_storage_plugin.bifrost.class_name: BifrostConnectorAdapter
  endpoint: 127.0.0.1:7744
  chunk_size: 262144
  timeout_seconds: 5.0
  strict_validation: true
  allow_pickle_fallback: true
