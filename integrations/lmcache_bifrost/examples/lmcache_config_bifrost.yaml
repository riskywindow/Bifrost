# Example LMCache configuration for the BIFROST remote storage plugin.
#
# LMCache plugin configuration keys have changed across releases. Verify this
# shape against the LMCache version installed in your environment before using
# it in a real serving stack.

remote_storage_plugins:
  - bifrost

# Preferred direct BIFROST URL. The adapter parses this to host:port for the
# BIFROST daemon client.
remote_url: bifrost://127.0.0.1:7744

extra_config:
  remote_storage_plugin.bifrost.module_path: lmcache_bifrost.adapter
  remote_storage_plugin.bifrost.class_name: BifrostConnectorAdapter
  chunk_size: 262144
  timeout_seconds: 5.0
  strict_validation: true
  allow_pickle_fallback: false

# LMCache 0.3.x loads custom adapters from top-level extra_config keys named
# remote_storage_plugin.<plugin>.module_path/class_name.
