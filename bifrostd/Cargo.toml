[package]
name = "bifrostd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[[bin]]
name = "bifrost-kv-validate"
path = "src/bin/bifrost_kv_validate.rs"
