name: model_roundtrip_small_ci
workload: model
model:
  vocab_size: 128
  max_seq_len: 128
  num_layers: 2
  num_heads: 2
  num_kv_heads: 2
  head_dim: 8
  dtype: float32
  seed: 1234
prompt: "1 2 3 4 5 6 7 8"
decode_tokens: 4
block_size_tokens: 4
operations:
  - local_kv_roundtrip
  - store_kv_roundtrip
repetitions: 1
timeout_seconds: 60
