# Optional vLLM + LMCache + BIFROST smoke configuration.
#
# This file is a scaffold for local experimentation. LMCache and vLLM have
# changed configuration keys across releases, so treat version-sensitive fields
# below as examples to verify against your installed versions.

# Version-sensitive: LMCache 0.3.x uses `remote_storage_plugins` plus top-level
# `extra_config` keys for custom remote adapters.
remote_storage_plugins:
  - bifrost

# Preferred BIFROST remote URL shape for the adapter.
remote_url: bifrost://127.0.0.1:7744

extra_config:
  remote_storage_plugin.bifrost.module_path: lmcache_bifrost.adapter
  remote_storage_plugin.bifrost.class_name: BifrostConnectorAdapter
  endpoint: 127.0.0.1:7744
  chunk_size: 262144
  timeout_seconds: 5.0
  strict_validation: true
  allow_pickle_fallback: false

# Version-sensitive: vLLM/LMCache integration flags differ by release. Keep the
# smoke test pointed at this file through LMCACHE_CONFIG_FILE, and pass any
# additional vLLM flags manually in the local environment when your installed
# version requires them.
local_cpu: false
enable_blending: false
chunk_size: 256

# This smoke stores only LMCache-owned opaque bytes in BIFROST. It is not a raw
# vLLM KVTransfer connector configuration.
bifrost_object_type: opaque_engine_blob
bifrost_integration_name: lmcache_bifrost_remote_storage
