name: Phase 6

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase6:
    name: Serving benchmark harness, Rust, Python, and ContextStorm checks
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BIFROST_PHASE4_CPU_ONLY: "1"
      BIFROST_RUN_REAL_LMCACHE_TESTS: "0"
      BIFROST_RUN_REAL_LMCACHE_CONTEXTSTORM: "0"
      BIFROST_RUN_VLLM_SMOKE: "0"
      BIFROST_RUN_VLLM_LMCACHE_CONTEXTSTORM: "0"
      BIFROST_RUN_REAL_VLLM: "0"
      BIFROST_RUN_VLLM_BENCH: "0"
      BIFROST_RUN_TWO_INSTANCE_CACHE_SHARE: "0"
      BIFROST_ALLOW_MODEL_DOWNLOADS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch>=2.0.0"
          python -m pip install \
            -e "bifrost_py[dev]" \
            -e "contextstorm[dev]" \
            -e "integrations/lmcache_bifrost[dev]"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binaries
        run: cargo build --manifest-path bifrostd/Cargo.toml --bins

      - name: Run bifrostd Rust tests
        run: cargo test --manifest-path bifrostd/Cargo.toml

      - name: Run bifrost_py and Phase 6 Python tests
        run: pytest bifrost_py/tests tests

      - name: Run LMCache BIFROST fake integration tests
        run: pytest integrations/lmcache_bifrost/tests

      - name: Run ContextStorm unit tests
        working-directory: contextstorm
        run: pytest tests

      - name: Run Phase 6 environment doctor
        run: |
          python -m bifrost_serving.env_doctor \
            --endpoint 127.0.0.1:7420 \
            --output-json /tmp/phase6-env-doctor.json \
            --json

      - name: Run Phase 6 fake serving demo
        run: |
          python examples/serving_benchmark/fake_serving_demo.py \
            --output-dir /tmp/bifrost-phase6-fake-demo \
            --request-count 8 \
            --concurrency 2 \
            --json

      - name: Run ContextStorm Phase 6 fake serving scenario
        run: |
          contextstorm run contextstorm/scenarios/serve_fake_small_ci.yaml \
            --runs-root /tmp/contextstorm-runs \
            --run-id phase6-ci-serve-fake-small
