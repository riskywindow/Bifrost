name: Phase 1

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phase1:
    name: Python and Rust Phase 1 checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install -e "bifrost_py[dev]"

      - name: Regenerate identity vectors
        run: python tools/generate_identity_vectors.py

      - name: Check generated vector drift
        run: git diff --exit-code -- fixtures/test_vectors/object_identity_vectors.json fixtures/test_vectors/native_tiny_gpt_layer0_block0.reordered.meta.json

      - name: Run Python tests
        env:
          PYTHONPATH: bifrost_py
        run: pytest bifrost_py/tests tests

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path bifrostd/Cargo.toml
